participants_matrix:
  el:
    - el_type: besu
      el_image: hyperledger/besu:develop
      el_log_level: "info"
  cl:
    - cl_type: teku
      cl_image: consensys/teku:develop
      # Two nodes so each Teku has a peer: a single Teku stays in syncing state without peers and never proposes.
      count: 2

network_params:
  min_validator_withdrawability_delay: 1
  shard_committee_period: 1
  churn_limit_quotient: 16
  fulu_fork_epoch: 10
  genesis_delay: 120
  preset: minimal
  # ethereum-package defaults bpo_1/bpo_2 (blob-parameter-only forks) to epoch 0 and fails when
  # any BPO epoch precedes a non-genesis fulu_fork_epoch. Disable all five (FAR_FUTURE_EPOCH) so
  # the network keeps the Fulu blob parameters.
  bpo_1_epoch: 18446744073709551615
  bpo_2_epoch: 18446744073709551615
  bpo_3_epoch: 18446744073709551615
  bpo_4_epoch: 18446744073709551615
  bpo_5_epoch: 18446744073709551615

additional_services:
  - dora
  - tx_fuzz

dora_params:
  image: "ethpandaops/dora:master-latest"

# Global parameter to set the exit ip address of services and public ports
port_publisher:
  # Execution Layer public port exposed to your local machine
  # Disabled by default
  # Public port start defaults to 32000
  # You can't run multiple enclaves on the same port settings
  el:
    enabled: true
    public_port_start: 32000
  # Consensus Layer public port exposed to your local machine
  # Disabled by default
  # Public port start defaults to 33000
  # You can't run multiple enclaves on the same port settings
  cl:
    enabled: true
    public_port_start: 33000
  # Validator client public port exposed to your local machine
  # Disabled by default
  # Public port start defaults to 34000
  # You can't run multiple enclaves on the same port settings
  vc:
    enabled: true
    public_port_start: 34000
  # remote signer public port exposed to your local machine
  # Disabled by default
  # Public port start defaults to 35000
  # You can't run multiple enclaves on the same port settings
  remote_signer:
    enabled: true
    public_port_start: 35000
  # Additional services public port exposed to your local machine
  # Disabled by default
  # Public port start defaults to 36000
  # You can't run multiple enclaves on the same port settings
  additional_services:
    enabled: true
    public_port_start: 36000